<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体竞文化 · 体育赛事小程序原型 · 版本选择</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #f0f4ff 0%, #f7f9fc 55%, #f3f0ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .header { text-align: center; margin-bottom: 36px; }
  .header .logo { font-size: 15px; color: #7c3aed; letter-spacing: 3px; margin-bottom: 10px; font-weight: 600; }
  .header h1 { font-size: 28px; color: #1a2233; font-weight: 700; }
  .header p { font-size: 14px; color: #6b7280; margin-top: 8px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
  .card {
    display: block;
    width: 380px;
    background: #fff;
    border-radius: 18px;
    padding: 30px 28px;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(26, 34, 51, .07);
    border: 1px solid #eef1f6;
    transition: transform .18s ease, box-shadow .18s ease;
    position: relative;
    overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 36px rgba(26, 34, 51, .13); }
  .card .tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .card.v2 .tag { background: linear-gradient(90deg, #7c3aed, #a855f7); }
  .card.v1 .tag { background: linear-gradient(90deg, #1e6fff, #3b82f6); }
  .card h2 { font-size: 20px; color: #1a2233; margin-bottom: 8px; }
  .card .desc { font-size: 14px; color: #6b7280; line-height: 1.7; margin-bottom: 18px; }
  .card ul { list-style: none; margin-bottom: 20px; }
  .card li { font-size: 13px; color: #4b5563; line-height: 2; padding-left: 20px; position: relative; }
  .card li::before { content: "✓"; position: absolute; left: 0; font-weight: 700; }
  .card.v2 li::before { color: #7c3aed; }
  .card.v1 li::before { color: #1e6fff; }
  .card .go {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px dashed #e5e9f0;
    padding-top: 16px;
  }
  .card.v2 .go { color: #7c3aed; }
  .card.v1 .go { color: #1e6fff; }
  .footer { margin-top: 40px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">体竞文化</div>
    <h1>体育赛事服务小程序 · 交互原型</h1>
    <p>请选择要查看的版本</p>
  </div>

  <div class="cards">
    <a class="card v2" href="v2/">
      <span class="tag">V2 · 完整版</span>
      <h2>11 个模块</h2>
      <div class="desc">一期锁定范围，在基础版之上新增 7 个模块。</div>
      <ul>
        <li>三级分类（分站赛 / 市级赛 / 年度赛）</li>
        <li>赛程对阵（分组 / 对阵表 / 比分）</li>
        <li>短视频（视频号内嵌）</li>
        <li>参赛积分 · 消息通知 · 多管理员 等</li>
      </ul>
      <div class="go"><span>查看 V2 完整版原型</span><span>→</span></div>
    </a>

    <a class="card v1" href="v1/">
      <span class="tag">V1 · 基础版</span>
      <h2>4 个模块</h2>
      <div class="desc">起步基线版本，核心流程完整可用。</div>
      <ul>
        <li>赛事信息发布与管理</li>
        <li>在线报名</li>
        <li>成绩与排名</li>
        <li>赛事日历</li>
      </ul>
      <div class="go"><span>查看 V1 基础版原型</span><span>→</span></div>
    </a>
  </div>

  <div class="footer">原型页面右下角有版本切换浮标，可在两个版本间直接跳转</div>
</body>
</html>
